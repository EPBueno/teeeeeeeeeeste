<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allegro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

/* ===== Paleta (altere aqui) ===== */
:root{color-scheme:dark;--bg:#14161a;--p1:#2a2f36;--p2:#1f2328;--hi:#ffffff1a;--ink:#f1eadb;--muted:#a3a9b1;--line:#ffffff18;--amber:#ffb02e;--hot:#ff5a3c;--orange:#ff8a2a;--teal:#35d0b8;--tile:#2b3037;--lcd:#0a0b0d;--sh:0 22px 30px -18px #000c;--r:16px}
[data-theme=light]{color-scheme:light;--bg:#d7d2c5;--p1:#f6f2e9;--p2:#e8e3d7;--hi:#ffffffcc;--ink:#1d1f23;--muted:#585e66;--line:#0000001f;--amber:#f2a30f;--hot:#d9452a;--orange:#e5731a;--teal:#0f8f7e;--tile:#c6c0b2;--sh:0 20px 26px -18px #0006}

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:14px Inter,system-ui,sans-serif;background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--amber) 15%,transparent),transparent),radial-gradient(700px 500px at -5% 105%,color-mix(in srgb,var(--teal) 11%,transparent),transparent),var(--bg);background-attachment:fixed;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,.brand,.bpm,.big{font-family:"Space Grotesk",sans-serif}
h1{font-size:clamp(28px,3.2vw,40px);letter-spacing:-1.2px;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 24px}.muted{color:var(--muted)}.tiny{font-size:11px}.hidden{display:none!important}
.kicker{font:500 10px "IBM Plex Mono",monospace;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* materiais */
.panel,.card{position:relative;background:linear-gradient(165deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 #0003,var(--sh)}
.card{padding:18px;min-width:0}.card.flat{box-shadow:none}
.screws:before,.screws:after{content:"";position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,#0007);opacity:.55}.screws:before{left:10px}.screws:after{right:10px}

/* layout */
.app{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:26px;background:repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--p1),var(--p2));border-right:1px solid var(--line);box-shadow:inset -1px 0 0 var(--hi),14px 0 30px -20px #000a;z-index:4}
.brand{padding:0 8px;color:var(--ink)}.logo{width:150px;height:34px;display:block}
.nav{display:grid;gap:6px}
.nav button{border:1px solid transparent;background:none;color:var(--muted);text-align:left;padding:12px;border-radius:12px;display:flex;gap:12px;align-items:center;transition:color .2s,background .2s}
.nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--amber) 9%,transparent)}
.nav button.active{color:var(--ink);background:linear-gradient(var(--p2),var(--p1));box-shadow:inset 0 2px 7px #0007,inset 0 0 0 1px var(--line)}
.nav .ico{width:22px;text-align:center;font-size:17px}
.led{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--tile);box-shadow:inset 0 1px 2px #0008;transition:.25s}
.nav button.active .led{background:var(--amber);box-shadow:0 0 10px 2px var(--amber)}
.side-note{margin-top:auto;padding:12px 8px 0;color:var(--muted);font-size:11px;line-height:1.6;border-top:1px solid var(--line)}
main{min-width:0;padding:26px clamp(16px,3vw,44px) 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.crumb{font:500 11px "IBM Plex Mono",monospace;letter-spacing:1px;color:var(--muted)}.crumb b{color:var(--ink);font-weight:500}
.page{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:perspective(900px) translateY(12px) rotateX(3deg)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}

/* controles */
.btn,.iconbtn{border:1px solid var(--line);background:linear-gradient(180deg,var(--p1),var(--p2));color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:600;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 #0006,0 10px 14px -9px #0009;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover,.iconbtn:hover{filter:brightness(1.12)}.btn:active,.iconbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--hi),0 0 0 #0006}
.btn.primary{background:linear-gradient(180deg,#ffc95e,var(--amber));color:#1b1405;border-color:#0003}.btn.small{padding:7px 10px;font-size:12px}
.iconbtn.active{box-shadow:inset 0 2px 7px #0007;color:var(--amber)}
.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);color:var(--ink);border-radius:10px;background:color-mix(in srgb,var(--bg) 75%,transparent);box-shadow:inset 0 2px 5px #0004}
textarea{min-height:85px;resize:vertical}input[type=range]{padding:0;box-shadow:none;accent-color:var(--amber)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--teal) 18%,transparent);border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);font-size:11px}
.tabs{display:inline-flex;gap:4px;margin:14px 0 22px;padding:4px;border-radius:13px;background:color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:inset 0 2px 6px #0006;max-width:100%;overflow-x:auto}
.tabs button{background:transparent;border:0;padding:9px 14px;border-radius:9px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button.active{color:var(--ink);background:linear-gradient(var(--p1),var(--p2));box-shadow:inset 0 1px 0 var(--hi),0 2px 6px #0007}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.metric strong{font:500 34px "IBM Plex Mono",monospace;display:block;margin:9px 0 2px;color:var(--amber);text-shadow:0 0 16px color-mix(in srgb,var(--amber) 45%,transparent)}
[data-theme=light] .metric strong{color:var(--ink);text-shadow:none}
.lcd{background:var(--lcd);border-radius:10px;box-shadow:inset 0 3px 10px #000,0 1px 0 var(--hi)}
.led-sm{font:500 13px "IBM Plex Mono",monospace;color:var(--amber);background:var(--lcd);padding:6px 10px;border-radius:8px;box-shadow:inset 0 2px 6px #000;white-space:nowrap}
.tilt{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .25s}

/* início */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;padding:30px 32px;margin-bottom:16px;overflow:hidden;isolation:isolate}
.hero h1{font-size:clamp(34px,4.6vw,58px);line-height:1;letter-spacing:-2.4px;margin:10px 0 12px}.hero p{color:var(--muted);max-width:420px;line-height:1.6;margin:0 0 20px}
.lcdrow{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.time{padding:12px 18px}.time b{display:block;font:500 clamp(34px,5vw,54px)/1 "IBM Plex Mono",monospace;color:var(--amber);text-shadow:0 0 18px color-mix(in srgb,var(--amber) 55%,transparent)}.time small{font:500 9px "IBM Plex Mono";letter-spacing:2px;color:#8a8f96}
.vu{display:flex;gap:4px;align-items:flex-end;height:58px}.vu i{width:7px;border-radius:2px;background:linear-gradient(0deg,var(--teal),var(--amber) 65%,var(--hot));transform-origin:bottom;animation:vu .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--n)*35ms);opacity:.95}
@keyframes vu{from{transform:scaleY(0)}}
.disc{justify-self:center;width:min(100%,250px);aspect-ratio:1;border-radius:50%;position:relative;background:conic-gradient(from 30deg,#ffffff18,#0000 18%,#ffffff14 42%,#0000 65%,#ffffff18),repeating-radial-gradient(circle,#0c0d0f 0 2px,#191c20 2px 4px);box-shadow:0 30px 40px -20px #000,inset 0 0 0 3px #ffffff0d;animation:spin 24s linear infinite;transform:perspective(600px) rotateX(18deg)}
.disc:after{content:"♪";position:absolute;inset:34%;border-radius:50%;display:grid;place-items:center;font:700 34px "Space Grotesk";color:#241a05;background:radial-gradient(circle at 35% 30%,#ffd36e,var(--amber) 60%,var(--hot))}
@keyframes spin{to{transform:perspective(600px) rotateX(18deg) rotateZ(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--c);background:var(--lcd);box-shadow:inset 0 2px 6px #000,0 0 14px -4px var(--c)}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.stat strong{font:500 26px "IBM Plex Mono",monospace}
.maingrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.75fr);gap:16px;margin-bottom:16px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;text-align:left;color:var(--ink);background:linear-gradient(165deg,var(--p1),var(--p2));box-shadow:inset 0 1px 0 var(--hi),0 4px 0 #0006,0 14px 18px -12px #000a;position:relative;overflow:hidden;min-height:96px}
.pad:before{content:"";position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--pc);box-shadow:0 0 14px 1px var(--pc)}
.pad:active{transform:translateY(3px)!important;box-shadow:inset 0 1px 0 var(--hi)}
.pad .s{font-size:22px;color:var(--pc);display:block;margin:6px 0 8px}.pad b{display:block;font-size:12px}.pad small{font-size:10px;color:var(--muted)}
.bottom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.log-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.log-row:last-of-type{border-bottom:0}
.log-row .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--teal);box-shadow:0 0 10px var(--teal)}.log-row .dot.hot{background:var(--hot);box-shadow:0 0 10px var(--hot)}
.log-row div{flex:1;min-width:0}.log-row b,.log-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.log-row small{font-size:11px;color:var(--muted);margin-top:3px}.log-row strong{font:500 13px "IBM Plex Mono",monospace;white-space:nowrap}
.date-chip{width:44px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--lcd);color:var(--amber);flex:none;box-shadow:inset 0 2px 6px #000}.date-chip b{font:500 17px "IBM Plex Mono",monospace;line-height:1}.date-chip small{text-transform:uppercase;font-size:8px;color:#8a8f96!important;margin:3px 0 0!important}

/* HabitKit 3D */
.habit-period-control{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0}.habit-period-control span{color:var(--muted)}.habit-period-control select{width:auto;min-width:118px;padding:8px 10px}
.hk-meta{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.hk-wrap{container-type:inline-size}
.hk-scroll{padding-top:6px!important;--cs:clamp(10px,calc((100cqw - 40px - var(--n)*2px)/var(--n)),30px);overflow-x:auto;overflow-y:visible;padding:0 16px}
.hk-stage{position:relative;height:calc(var(--cs)*8.6 + 90px);width:calc(var(--n)*(var(--cs) + 2px));min-width:100%;perspective:1000px;perspective-origin:50% 0}
.hk-grid{position:absolute;left:0;top:calc(var(--cs)*2.2 + 44px);display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cs));grid-template-columns:repeat(var(--n),var(--cs));gap:2px;transform-style:preserve-3d;transform-origin:50% 0;transform:rotateX(var(--tx,50deg)) rotateY(var(--ty,0deg));transition:transform .3s ease-out}
.hk-cell{position:relative;width:var(--cs);height:var(--cs);padding:0;border:0;border-radius:3px;background:var(--tile);transform-style:preserve-3d;transition:transform .15s;--c:color-mix(in srgb,var(--tile) 88%,#fff);--hh:calc(var(--cs)*(.3 + var(--f,0)*1.4))}.hk-cell.l0{--hh:2px}
.hk-cell.l1{--c:var(--amber)}.hk-cell.l2{--c:var(--orange)}.hk-cell.l3{--c:var(--hot)}
.hk-cell .t,.hk-cell .f{position:absolute;display:block;transition:filter .15s}
.hk-cell .t{inset:0;border-radius:3px;background:var(--c);transform:translateZ(var(--hh))}
.hk-cell .f{left:0;bottom:0;width:100%;height:var(--hh);background:color-mix(in srgb,var(--c) 58%,#000);transform-origin:bottom;transform:rotateX(-90deg)}
.hk-cell:not(.l0) .t{animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*14ms)}
.hk-cell:not(.l0) .f{animation:grow .7s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*14ms)}
@keyframes rise{from{transform:translateZ(0)}}@keyframes grow{from{height:0}}
.hk-cell:hover{transform:translateZ(9px)}.hk-cell:hover .t,.hk-cell:hover .f{filter:brightness(1.25)}
.hk-cell.sel{transform:translateZ(12px)}.hk-cell.sel .t{box-shadow:0 0 0 2px #fff,0 0 20px 3px var(--c)}.hk-cell.sel .f{filter:brightness(1.3)}
.hk-cell:focus-visible{outline:0}.hk-cell:focus-visible .t{box-shadow:0 0 0 2px var(--teal)}
.heatlabels{display:flex;justify-content:space-between;color:var(--muted);font:10px "IBM Plex Mono",monospace;margin:6px 4px 0}
.hk-legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0;color:var(--muted);font-size:10px}.hk-legend span{display:flex;align-items:center;gap:6px}.hk-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hk-panel{padding:14px 16px;border-radius:13px;background:color-mix(in srgb,var(--bg) 70%,transparent);box-shadow:inset 0 2px 8px #0005;border:1px solid var(--line);animation:enter .3s}.hk-panel h3{margin:3px 0 0}.hk-panel .row{margin-bottom:8px}.hk-panel .btn{margin-top:10px}

/* repertório */
.workgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px}
.work{min-width:0;cursor:pointer}.rec{position:relative}
.vinyl{position:absolute;top:5%;left:8%;width:90%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0c0d0f 0 2px,#1b1e22 2px 4px);box-shadow:0 8px 14px -6px #000;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.vinyl:after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--amber)}
.work:hover .vinyl,.work:focus-visible .vinyl{transform:translateX(24%) rotate(90deg)}
.cover{position:relative;z-index:1;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;font:700 52px "Space Grotesk";color:color-mix(in srgb,var(--ink) 80%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 38%,var(--p1)),color-mix(in srgb,var(--hot) 25%,var(--p2)));border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff4,6px 10px 18px -6px #000b}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff3 0,#0000 40%)}.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-help{font-size:11px;color:var(--muted)}.lib-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:12px;display:block}
.work h3{margin:12px 0 3px;font-size:14px}.work .muted{font-size:12px}

/* planejamento */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kan-col{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;min-height:240px;background:color-mix(in srgb,var(--bg) 62%,transparent);box-shadow:inset 0 3px 10px #0004}
.kan-col:before{content:"";position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:0 0 4px 4px;background:var(--cc);box-shadow:0 0 14px var(--cc)}
.kan-col:nth-child(1){--cc:var(--hot)}.kan-col:nth-child(2){--cc:var(--amber)}.kan-col:nth-child(3){--cc:var(--teal)}
.kan-col h3{padding:6px 4px 12px;font:500 12px "IBM Plex Mono",monospace;letter-spacing:1.5px;text-transform:uppercase}
.kan-card{background:linear-gradient(165deg,var(--p1),var(--p2));border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px;cursor:grab;box-shadow:inset 0 1px 0 var(--hi),0 3px 0 #0005,0 10px 14px -10px #000a;transition:transform .15s}
.kan-card:hover{transform:translateY(-3px)}.kan-card p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.45}.kan-card .due{font:11px "IBM Plex Mono",monospace;color:var(--amber)}

/* metrônomo */
.mdev{max-width:720px;margin:auto;padding:clamp(22px,4vw,40px);text-align:center}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mlcd{padding:16px 10px 12px;margin-bottom:18px}.bpm{font:500 clamp(64px,12vw,96px)/1 "IBM Plex Mono",monospace;color:var(--amber);text-shadow:0 0 24px color-mix(in srgb,var(--amber) 55%,transparent)}.mlcd small{font:500 10px "IBM Plex Mono";letter-spacing:3px;color:#8a8f96}
.arm-box{position:relative;height:74px;margin:2px auto 8px;width:160px;overflow:hidden}
.arm{position:absolute;left:50%;bottom:0;width:4px;height:68px;margin-left:-2px;border-radius:3px;background:linear-gradient(90deg,#999,#eee,#999);transform-origin:50% 100%;transform:rotate(-26deg)}.arm:after{content:"";position:absolute;top:10px;left:-7px;width:18px;height:14px;border-radius:3px;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.arm.run{animation:sway var(--d) ease-in-out infinite alternate}@keyframes sway{to{transform:rotate(26deg)}}
.pulse{display:flex;gap:14px;justify-content:center;padding:12px;flex-wrap:wrap}
.pulse i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3,transparent 45%),var(--tile);box-shadow:inset 0 2px 4px #0008;transition:transform .08s,background .08s,box-shadow .08s}
.pulse i.on{background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--amber);box-shadow:0 0 16px 4px var(--amber);transform:scale(1.3)}.pulse i.on:first-child{background:radial-gradient(circle at 35% 30%,#fff9,transparent 45%),var(--hot);box-shadow:0 0 16px 4px var(--hot)}
.keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0}.keys .btn{min-width:54px;font-family:"IBM Plex Mono",monospace}
.go{width:96px;height:96px;border-radius:50%;font-size:15px;font-weight:700;border:4px solid #0003;color:#1b1405;background:radial-gradient(circle at 35% 25%,#ffe08e,var(--amber) 55%,#c47a00);box-shadow:inset 0 2px 0 #fff8,0 6px 0 #0007,0 18px 22px -8px #000a;transition:transform .08s,box-shadow .08s}
.go:active,.go.on{transform:translateY(5px);box-shadow:inset 0 2px 0 #fff6,0 1px 0 #0007}.go.on{background:radial-gradient(circle at 35% 25%,#ff9d86,var(--hot) 60%,#a22a14);color:#fff}
.transport{display:flex;gap:18px;align-items:center;justify-content:center;margin:18px 0}

/* misc */
.toast{position:fixed;bottom:22px;right:22px;background:var(--lcd);color:var(--amber);font:500 13px "IBM Plex Mono",monospace;padding:12px 16px;border-radius:10px;box-shadow:0 0 0 1px var(--line),0 12px 30px #000a;z-index:50;animation:enter .25s}
.settings-panel{max-width:720px}
.modal-backdrop{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s}@keyframes fade{from{opacity:0}}
.modal{background:linear-gradient(165deg,var(--p1),var(--p2));border-radius:18px;padding:22px;width:min(620px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi),0 40px 80px -20px #000;animation:enter .3s}.modal h2{margin-bottom:16px}
a{color:var(--teal)}

@media(max-width:1000px){.app{grid-template-columns:78px 1fr}.side{padding:20px 9px;align-items:center}.logo{width:44px;overflow:hidden}.nav button{justify-content:center;font-size:0;padding:12px 10px}.nav .led,.side-note{display:none}.workgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.maingrid{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block;padding-bottom:72px}.side{position:fixed;top:auto;height:66px;left:0;right:0;bottom:0;padding:6px 8px;border-right:0;border-top:1px solid var(--line);display:block}.brand,.side-note{display:none}.nav{display:flex;gap:0}.nav button{flex-direction:column;gap:2px;padding:7px 2px;font-size:9px;flex:1;justify-content:center;align-items:center}main{padding:18px 14px 30px}.grid.two,.grid.three,.bottom,.hero{grid-template-columns:1fr}.disc{display:none}.hero{padding:22px 18px}.stats{gap:8px}.stat{padding:12px 10px;gap:8px;flex-direction:column;align-items:flex-start}.workgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kanban{grid-template-columns:repeat(3,250px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.tilt{transform:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><svg class="logo" viewBox="0 0 150 34" role="img" aria-label="allegro"><g fill="#ffb02e"><rect x="0" y="14" width="4" height="10" rx="2"/><rect x="8" y="6" width="4" height="26" rx="2"/><rect x="16" y="10" width="4" height="18" rx="2"/><rect x="24" y="1" width="4" height="32" rx="2" fill="#ff5a3c"/><rect x="32" y="12" width="4" height="14" rx="2"/></g><text x="46" y="26" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="27" letter-spacing="-1" fill="currentColor">allegro</text></svg></div>
<nav class="nav" id="nav">
<button class="active" data-page="inicio"><span class="ico">⌂</span><span>Início</span><i class="led"></i></button>
<button data-page="estudos"><span class="ico">♩</span><span>Estudos</span><i class="led"></i></button>
<button data-page="repertorio"><span class="ico">♫</span><span>Repertório</span><i class="led"></i></button>
<button data-page="planejamento"><span class="ico">▦</span><span>Planejamento</span><i class="led"></i></button>
<button data-page="metronomo"><span class="ico">◷</span><span>Metrônomo</span><i class="led"></i></button>
</nav>
<div class="side-note">Dados guardados neste navegador.<br>Exporta backups em Configurações.</div>
</aside>
<main>
<header class="topbar"><div class="crumb">allegro / <b id="crumb">Início</b></div><div class="top-actions"><button class="iconbtn" id="settingsShortcut" title="Configurações" aria-label="Configurações">⚙</button></div></header>
<section id="view" class="page"></section>
</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modalRoot"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const pages={inicio:'Início',estudos:'Estudos',repertorio:'Repertório e Biblioteca',planejamento:'Planejamento',metronomo:'Metrônomo',config:'Configurações'};
const blank=()=>({sessions:[],exercises:[],works:[],library:[],commitments:[],settings:{theme:'dark'},libraryTab:'Repertório'});
let db;try{db=JSON.parse(localStorage.getItem('allegro-db'))||blank()}catch{db=blank()}
db={...blank(),...db,settings:{...blank().settings,...(db.settings||{})}};
let page='inicio',studyTab='Visão geral',repoTab='Repertório',selDay=null,toastTimer=null;
const metro={bpm:80,running:false,tick:0,next:0,timer:null,meter:'4/4',subdiv:'Semínimas',vol:65};

/* ---------- utilidades e dados ---------- */
function save(){try{localStorage.setItem('allegro-db',JSON.stringify(db));toast('Salvo')}catch(e){toast('Não foi possível salvar. Exporta um backup e verifica o espaço disponível.')}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return 'Sem prazo';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}
// Modelo combinado: sessões manuais + registros da rotina técnica (cada registro contado uma única vez)
function mins(){const a=db.sessions.reduce((n,s)=>n+(Number(s.duration)||0),0);const b=db.exercises.reduce((t,e)=>t+(e.logs||[]).reduce((x,l)=>x+(Number(l.duration)||0),0),0);return a+b}
function activeDays(){return new Set(db.sessions.filter(s=>s.date).map(s=>s.date).concat(db.exercises.flatMap(e=>(e.logs||[]).map(l=>l.date)))).size}
function dayCounts(){const c={};const add=(d,m)=>{m=Number(m)||0;if(d&&m>0)c[d]=(c[d]||0)+m};db.sessions.forEach(s=>add(s.date,s.duration));db.exercises.forEach(e=>(e.logs||[]).forEach(l=>add(l.date,l.duration)));return c}
function lastDates(n){const out=[],now=new Date();for(let i=n-1;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);out.push(d.toISOString().slice(0,10))}return out}
function fmtMin(m){return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'}
function header(title,desc,action=''){return `<div class="row" style="align-items:flex-start"><div><h1>${title}</h1><p class="sub">${desc||''}</p></div>${action}</div>`}

/* ---------- HabitKit 3D ---------- */
function habitWeeks(){return Math.max(1,Math.min(52,Number(db.settings.habitWeeks)||16))}
function setHabitWeeks(v){db.settings.habitWeeks=Math.max(1,Math.min(52,Number(v)||16));localStorage.setItem('allegro-db',JSON.stringify(db));render()}
function habitPeriodControl(){const w=habitWeeks();return `<div class="habit-period-control"><span>Exibir:</span><select aria-label="Escolher período do HabitKit" onchange="setHabitWeeks(this.value)">${[4,8,12,16,20,24,32,40,52].map(n=>`<option value="${n}" ${w===n?'selected':''}>${n} semanas</option>`).join('')}</select></div>`}
function habitKit(){
 const w=habitWeeks(),dates=lastDates(w*7),c=dayCounts();
 const total=dates.reduce((n,d)=>n+(c[d]||0),0),act=dates.filter(d=>c[d]).length;
 if(!selDay)selDay=today();
 const focusD=dates.includes(selDay)?selDay:dates[dates.length-1];
 const cells=dates.map((d,i)=>{const m=c[d]||0,lv=m>60?3:m>=40?2:m>0?1:0,f=m?Math.min(m,120)/120:0;
  return `<button class="hk-cell l${lv}${d===selDay?' sel':''}" data-d="${d}" style="--f:${f.toFixed(2)};--i:${Math.floor(i/7)}" tabindex="${d===focusD?0:-1}" aria-pressed="${d===selDay}" title="${fmtDate(d)}${m?` · ${m} min`:''}" aria-label="${fmtDate(d)}${m?` · ${m} minutos`:' · sem atividade'}"><i class="t"></i><i class="f"></i></button>`}).join('');
 return `<div class="hk"><div class="hk-meta"><span class="pill">${fmtMin(total)} no período</span><span class="pill">${act} ${act===1?'dia ativo':'dias ativos'}</span></div>
 <div class="hk-wrap" style="--n:${w}"><div class="hk-scroll"><div class="hk-stage"><div class="hk-grid" role="group" aria-label="Atividade por dia">${cells}</div></div></div></div>
 <div class="heatlabels"><span>${w} ${w===1?'semana':'semanas'} atrás</span><span>Hoje</span></div>
 <div class="hk-legend"><span><i style="background:var(--tile)"></i>Sem registro</span><span><i style="background:var(--amber)"></i>Até 39 min</span><span><i style="background:var(--orange)"></i>40 a 60 min</span><span><i style="background:var(--hot)"></i>Mais de 60 min</span><span class="muted">Altura = tempo estudado</span></div>
 <div class="hk-panel" aria-live="polite">${dayPanel(selDay)}</div></div>`}
function dayPanel(d){
 const a=db.sessions.filter(s=>s.date===d),b=db.exercises.flatMap(e=>(e.logs||[]).filter(l=>l.date===d).map(l=>({name:e.name,...l})));
 const t=a.reduce((n,s)=>n+(Number(s.duration)||0),0)+b.reduce((n,x)=>n+(Number(x.duration)||0),0);
 return `<div class="row"><div><div class="kicker">Dia selecionado</div><h3>${fmtDate(d)}</h3></div><span class="led-sm">${t} min</span></div>
 ${a.map(s=>`<div class="log-row"><span class="dot"></span><div><b>${esc(s.content||s.focus||'Sessão')}</b><small>Sessão · ${esc(s.focus||'Estudo')}${s.bpm?' · '+s.bpm+' BPM':''}</small></div><strong>${s.duration||0} min</strong></div>`).join('')}
 ${b.map(x=>`<div class="log-row"><span class="dot hot"></span><div><b>${esc(x.name)}</b><small>Rotina técnica · ${x.bpm||'—'} BPM</small></div><strong>${x.duration||0} min</strong></div>`).join('')}
 ${!a.length&&!b.length?'<p class="muted" style="margin:6px 0">Nenhuma atividade registrada neste dia.</p>':''}
 <button class="btn small" onclick="go('estudos');sessionForm(null,'${d}')">＋ Registrar neste dia</button>`}
function selectDay(d){selDay=d;$$('.hk-cell').forEach(el=>{const on=el.dataset.d===d;el.classList.toggle('sel',on);el.tabIndex=on?0:-1;el.setAttribute('aria-pressed',on)});$$('.hk-panel').forEach(p=>p.innerHTML=dayPanel(d))}
function showDay(d){selectDay(d)}

/* ---------- render e navegação ---------- */
function render(){
 document.documentElement.dataset.theme=db.settings.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):db.settings.theme;
 $('#crumb').textContent=pages[page];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#settingsShortcut').classList.toggle('active',page==='config');
 $('#view').innerHTML=page==='inicio'?home():page==='estudos'?studies():page==='repertorio'?repertoire():page==='planejamento'?planning():page==='metronomo'?metronome():settings();
 $('#view').classList.remove('page');void $('#view').offsetWidth;$('#view').classList.add('page');
 if(page==='planejamento')bindDrops();
}
function go(p){if(metro.running&&p!=='metronomo')stopMetro();page=p;render();window.scrollTo({top:0})}
function home(){
 const upcoming=db.commitments.filter(c=>c.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);
 const recent=[...db.sessions.map(s=>({...s,label:s.content||s.focus||'Sessão livre',kind:s.focus||'Estudo'})),...db.exercises.flatMap(e=>(e.logs||[]).map(l=>({...l,label:e.name,kind:'Rotina técnica'})))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
 const total=mins(),c=dayCounts(),vd=lastDates(16),mx=Math.max(60,...vd.map(d=>c[d]||0));
 const pad=(col,sym,t,s,act)=>`<button class="pad tilt" style="--pc:${col}" onclick="${act}"><span class="s">${sym}</span><b>${t}</b><small>${s}</small></button>`;
 return `<section class="hero panel screws"><div><div class="kicker">Estúdio · central de controle</div><h1>Bem-vindo ao allegro</h1><p>Teu espaço de estudo: tempo de prática, constância e próximos compromissos num só painel.</p>
 <div class="lcdrow"><div class="lcd time"><b>${Math.floor(total/60)}:${String(total%60).padStart(2,'0')}</b><small>HORAS TOTAIS · SESSÕES + ROTINA TÉCNICA</small></div><div class="vu" aria-hidden="true" title="Últimos 16 dias">${vd.map((d,i)=>`<i style="--n:${i};height:${Math.max(6,Math.round((c[d]||0)/mx*100))}%"></i>`).join('')}</div></div>
 <div class="actions"><button class="btn primary" onclick="go('estudos');sessionForm()">＋ Registrar estudo</button><button class="btn" onclick="go('repertorio')">Explorar repertório</button></div></div><div class="disc" aria-hidden="true"></div></section>
<section class="stats"><article class="card stat"><span class="ic" style="--c:var(--teal)">◷</span><div><small>Dias com prática</small><strong>${activeDays()}</strong></div></article><article class="card stat"><span class="ic" style="--c:var(--amber)">♫</span><div><small>Obras no repertório</small><strong>${db.works.length}</strong></div></article><article class="card stat"><span class="ic" style="--c:var(--hot)">⌁</span><div><small>Exercícios técnicos</small><strong>${db.exercises.length}</strong></div></article></section>
<section class="maingrid"><div class="card"><div class="row" style="margin-bottom:6px"><div><div class="kicker">HabitKit</div><h2 style="margin:4px 0 0">Constância</h2></div>${habitPeriodControl()}</div>${habitKit()}</div>
<div class="card"><div class="kicker" style="margin-bottom:12px">Atalhos</div><div class="pads">${pad('var(--amber)','＋','Registrar estudo','Adicionar uma sessão',"go('estudos');sessionForm()")}${pad('var(--teal)','♫','Adicionar obra','Ampliar o repertório',"go('repertorio');workForm()")}${pad('var(--hot)','⌑','Novo compromisso','Organizar preparação',"go('planejamento');commitmentForm()")}${pad('var(--orange)','♩','Abrir metrônomo','Praticar com pulso',"go('metronomo')")}</div></div></section>
<section class="bottom"><div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Atividade recente</h2><button class="btn small" onclick="go('estudos')">Ver estudos</button></div>${recent.map(s=>`<div class="log-row"><span class="dot ${s.kind==='Rotina técnica'?'hot':''}"></span><div><b>${esc(s.label)}</b><small>${esc(s.kind)} · ${fmtDate(s.date)}</small></div><strong>${Number(s.duration)||0} min</strong></div>`).join('')||'<div class="empty">Os registros de estudo aparecerão aqui.</div>'}</div>
<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Próximos compromissos</h2><button class="btn small" onclick="go('planejamento')">Abrir quadro</button></div>${upcoming.map(c=>`<div class="log-row"><span class="date-chip"><b>${new Date(c.due+'T12:00:00').getDate()}</b><small>${new Date(c.due+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'})}</small></span><div><b>${esc(c.title)}</b><small>${esc(c.person||c.event||'Compromisso')}</small></div></div>`).join('')||'<div class="empty">Nenhum compromisso com prazo cadastrado.</div>'}</div></section>`}

/* ---------- estudos ---------- */
function studies(){return `${header('Estudos','Registra a prática e acompanha tua evolução.','<button class="btn primary" onclick="sessionForm()">＋ Registrar estudo</button>')}<div class="tabs" role="tablist">${['Visão geral','Sessões','Rotina técnica','Histórico'].map(t=>`<button role="tab" class="${studyTab===t?'active':''}" onclick="studyTab='${t}';render()">${t}</button>`).join('')}</div>${studyTab==='Visão geral'?`<div class="grid two"><div class="card metric"><span class="muted">Tempo estudado</span><strong>${Math.floor(mins()/60)}h ${mins()%60}m</strong><span class="tiny muted">Todos os registros</span></div><div class="card metric"><span class="muted">Dias ativos</span><strong>${activeDays()}</strong><span class="tiny muted">Histórico total</span></div></div><div class="section-head"><h2 style="margin:0">Constância · violão</h2>${habitPeriodControl()}</div><div class="card">${habitKit()}</div><div class="section-head"><h2 style="margin:0">Atalhos</h2></div><div class="actions"><button class="btn primary" onclick="sessionForm()">Registrar estudo</button><button class="btn" onclick="studyTab='Rotina técnica';render()">Abrir rotina técnica</button></div>`:studyTab==='Rotina técnica'?`<div class="row" style="margin-bottom:14px"><h2 style="margin:0">Exercícios</h2><button class="btn primary" onclick="exerciseForm()">＋ Novo exercício</button></div><div class="grid two">${db.exercises.map((e,i)=>`<div class="card"><div class="row"><h3>${esc(e.name)}</h3><span class="pill">${esc(e.category||'Técnica')}</span></div><p class="muted">${esc(e.description||'')}</p><div class="row"><span class="tiny muted">Último BPM</span><span class="led-sm">${(e.logs||[]).slice(-1)[0]?.bpm||'—'}</span></div><div class="actions" style="margin-top:14px"><button class="btn small primary" onclick="exerciseLog(${i})">Registrar prática</button><button class="btn small" onclick="exerciseDetails(${i})">Histórico</button></div></div>`).join('')||'<div class="empty">Adiciona teus exercícios técnicos para começar.</div>'}</div>`:`<div class="card">${db.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(s.content||s.focus||'Sessão de estudo')}</b><div class="tiny muted">${fmtDate(s.date)} · ${esc(s.focus||'')}</div></div><div class="actions"><span class="led-sm">${s.duration||0} min</span><button class="btn small" onclick="editSession(${db.sessions.indexOf(s)})">Editar</button><button class="btn small" aria-label="Excluir" onclick="deleteSession(${db.sessions.indexOf(s)})">×</button></div></div>`).join('')||'<div class="empty">Ainda não há sessões registradas.</div>'}</div>`}`}
function sessionForm(idx=null,presetDate=null){const s=idx===null?{}:db.sessions[idx];modal(`<h2>${idx===null?'Registrar estudo':'Editar sessão'}</h2><form id="sessionForm"><div class="grid two"><div class="field"><label>Data</label><input name="date" type="date" value="${s.date||presetDate||today()}" required></div><div class="field"><label>Duração (minutos)</label><input name="duration" type="number" min="0" value="${s.duration||30}" required></div></div><div class="field"><label>Foco</label><select name="focus">${['Técnica','Repertório','Composição/arranjo','Teoria/percepção','Estudo livre'].map(x=>`<option ${s.focus===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Conteúdo</label><input name="content" value="${esc(s.content||'')}" placeholder="Ex.: arpejos, introdução da obra..."></div><div class="grid two"><div class="field"><label>BPM (opcional)</label><input name="bpm" type="number" min="1" max="400" value="${s.bpm||''}"></div><div class="field"><label>Como foi?</label><select name="difficulty"><option value="">Não informar</option>${['Leve','Moderada','Difícil'].map(x=>`<option ${s.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Observações</label><textarea name="notes">${esc(s.notes||'')}</textarea></div><div class="actions"><button class="btn primary" type="submit">Salvar sessão</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
 $('#sessionForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.duration=+o.duration;o.bpm=o.bpm?+o.bpm:null;if(idx===null)db.sessions.push(o);else db.sessions[idx]=o;selDay=o.date;save();closeModal();render();toast('♪ Sessão registrada · '+o.duration+' min')}}
function editSession(i){sessionForm(i)}function deleteSession(i){if(confirm('Excluir esta sessão?')){db.sessions.splice(i,1);save();render()}}
function exerciseForm(){modal(`<h2>Novo exercício</h2><form id="exForm"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Categoria</label><input name="category" placeholder="Ex.: mão direita, sincronização"></div><div class="field"><label>Descrição</label><textarea name="description"></textarea></div><div class="actions"><button class="btn primary">Criar exercício</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div></form>`);$('#exForm').onsubmit=e=>{e.preventDefault();db.exercises.push({...Object.fromEntries(new FormData(e.target)),logs:[]});save();closeModal();render()}}
function exerciseLog(i){const e=db.exercises[i];modal(`<h2>Registrar prática · ${esc(e.name)}</h2><form id="logForm"><div class="grid two"><div class="field"><label>Data</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>BPM</label><input type="number" name="bpm" min="1" max="400"></div></div><div class="field"><label>Tempo dedicado (min)</label><input type="number" name="duration" min="0" value="10"></div><div class="field"><label>Observações</label><textarea name="notes"></textarea></div><button class="btn primary">Salvar prática</button></form>`);$('#logForm').onsubmit=ev=>{ev.preventDefault();const o=Object.fromEntries(new FormData(ev.target));o.bpm=+o.bpm||null;o.duration=+o.duration||0;(e.logs=e.logs||[]).push(o);selDay=o.date;save();closeModal();render();toast('♪ Prática registrada · '+o.duration+' min')}}
function exerciseDetails(i){const e=db.exercises[i];modal(`<h2>${esc(e.name)}</h2><p class="muted">${esc(e.category||'Técnica')}</p><div class="card flat"><h3>Histórico de BPM</h3>${(e.logs||[]).map(l=>`<div class="row" style="padding:8px 0"><span>${fmtDate(l.date)}</span><b>${l.bpm||'—'} BPM</b></div>`).join('')||'<p class="muted">Sem práticas registradas.</p>'}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}

/* ---------- repertório e biblioteca ---------- */
function newRepoItem(){if(repoTab==='Repertório')workForm();else libraryForm()}
function repertoire(){return `${header('Repertório e Biblioteca','Obras, materiais e referências.','<button class="btn primary" onclick="newRepoItem()">＋ Novo item</button>')}<div class="tabs">${['Repertório','Biblioteca'].map(t=>`<button class="${repoTab===t?'active':''}" onclick="repoTab='${t}';render()">${t}</button>`).join('')}</div>${repoTab==='Repertório'?`<div class="row" style="margin-bottom:22px;flex-wrap:wrap;justify-content:flex-start"><input id="workSearch" placeholder="Buscar obra ou compositor..." oninput="filterWorks()" style="max-width:320px"><select id="workStatus" onchange="filterWorks()" style="max-width:190px"><option value="">Todos os estados</option>${['Quero aprender','Em estudo','Em revisão','Pronta'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="workgrid" id="workgrid">${workCards(db.works)}</div>`:`<div class="row" style="margin-bottom:18px;flex-wrap:wrap;justify-content:flex-start"><input id="libSearch" placeholder="Buscar materiais, tags e categorias..." oninput="filterLibrary()" style="max-width:360px"><select id="libCat" onchange="filterLibrary()" style="max-width:190px"><option value="">Todas as categorias</option>${['Teoria musical','Percepção','Materiais','Referências'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="grid two" id="libgrid">${libraryCards(db.library)}</div>`}`}
function workCards(works){return works.map(w=>`<article class="work tilt" tabindex="0" onkeydown="if(event.key==='Enter')workDetails(${db.works.indexOf(w)})" onclick="workDetails(${db.works.indexOf(w)})"><div class="rec"><i class="vinyl"></i><div class="cover">${w.image?`<img src="${esc(w.image)}" alt="">`:esc((w.title||'♪').slice(0,1))}</div></div><h3>${esc(w.title)}</h3><div class="muted">${esc(w.composer||'Compositor não informado')}</div><div class="tiny muted" style="margin-top:7px">${esc(w.status||'Quero aprender')}</div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">Teu repertório começa com a primeira obra cadastrada.</div>'}
function filterWorks(){const q=($('#workSearch')?.value||'').toLowerCase(),st=$('#workStatus')?.value||'';$('#workgrid').innerHTML=workCards(db.works.filter(w=>((w.title||'')+' '+(w.composer||'')).toLowerCase().includes(q)&&(!st||w.status===st)))}
function workForm(idx=null){const w=idx===null?{}:db.works[idx];modal(`<h2>${idx===null?'Adicionar obra':'Editar obra'}</h2><form id="workForm"><div class="field"><label>Título</label><input name="title" value="${esc(w.title||'')}" required></div><div class="field"><label>Compositor</label><input name="composer" value="${esc(w.composer||'')}"></div><div class="grid two"><div class="field"><label>Ritmo/gênero</label><input name="genre" value="${esc(w.genre||'')}"></div><div class="field"><label>Dificuldade</label><select name="difficulty">${['Não definida','Fácil','Moderada','Difícil','Muito difícil'].map(x=>`<option ${w.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Estado</label><select name="status">${['Quero aprender','Em estudo','Em revisão','Pronta'].map(x=>`<option ${w.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Imagem de capa (URL, opcional)</label><input name="image" value="${esc(w.image||'')}" placeholder="Cola um link de imagem"></div><div class="field"><label>Ou escolhe uma imagem do computador/celular</label><input name="coverFile" type="file" accept="image/*"><span class="cover-help">A imagem será ajustada para uma capa quadrada, como um álbum.</span></div><div class="field"><label>Notas e técnicas</label><textarea name="notes">${esc(w.notes||'')}</textarea></div><div class="field"><label>Links de referência (um por linha)</label><textarea name="links">${esc((w.links||[]).join('\n'))}</textarea></div><div class="actions"><button class="btn primary">Salvar obra</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div></form>`);
 $('#workForm').onsubmit=async e=>{e.preventDefault();const form=e.target,o=Object.fromEntries(new FormData(form)),file=form.elements.coverFile?.files[0];if(file){try{o.image=await imageToCover(file)}catch(err){toast('Não consegui ler essa imagem.');return}}delete o.coverFile;o.links=o.links.split('\n').map(x=>x.trim()).filter(Boolean);if(idx===null)db.works.push(o);else db.works[idx]=o;save();closeModal();render()}}
function workDetails(i){const w=db.works[i];modal(`<div class="row"><h2>${esc(w.title)}</h2><button class="btn small" aria-label="Fechar" onclick="closeModal()">✕</button></div><p class="muted">${esc(w.composer||'')} · ${esc(w.genre||'')}</p><p>${esc(w.notes||'Sem notas adicionadas.')}</p><p><span class="pill">${esc(w.status||'Quero aprender')}</span> <span class="pill">${esc(w.difficulty||'Não definida')}</span></p><h3>Referências</h3>${(w.links||[]).map(l=>`<p><a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a></p>`).join('')||'<p class="muted">Nenhum link cadastrado.</p>'}<div class="actions" style="margin-top:14px"><button class="btn primary" onclick="workForm(${i})">Editar obra</button><button class="btn" onclick="commitmentForm(null,${i})">Planejar esta obra</button><button class="btn" onclick="if(confirm('Excluir obra?')){db.works.splice(${i},1);save();closeModal();render()}">Excluir</button></div>`)}
function libraryForm(idx=null){const x=idx===null?{}:db.library[idx];modal(`<h2>${idx===null?'Novo item da biblioteca':'Editar item da biblioteca'}</h2><form id="libForm"><div class="field"><label>Título</label><input name="title" value="${esc(x.title||'')}" required></div><div class="field"><label>Categoria</label><select name="category">${['Teoria musical','Percepção','Materiais','Referências'].map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Capa (URL, opcional)</label><input name="image" value="${esc(x.image||'')}" placeholder="Cola um link de imagem"></div><div class="field"><label>Ou escolhe uma imagem do computador/celular</label><input name="coverFile" type="file" accept="image/*"><span class="cover-help">A capa ajuda a reconhecer livros, partituras e materiais visualmente.</span></div><div class="field"><label>Descrição e tags</label><textarea name="description">${esc(x.description||'')}</textarea></div><div class="field"><label>Links (um por linha)</label><textarea name="links">${esc((x.links||[]).join('\n'))}</textarea></div><div class="actions"><button class="btn primary">Salvar item</button><button type="button" class="btn" onclick="closeModal()">Cancelar</button></div></form>`);
 $('#libForm').onsubmit=async e=>{e.preventDefault();const form=e.target,o=Object.fromEntries(new FormData(form)),file=form.elements.coverFile.files[0];if(file){try{o.image=await imageToCover(file)}catch(err){toast('Não consegui ler essa imagem.');return}}delete o.coverFile;o.links=o.links.split('\n').map(l=>l.trim()).filter(Boolean);if(idx===null)db.library.push(o);else db.library[idx]=o;save();closeModal();render()}}
function libraryCards(items){return items.map(x=>`<div class="card">${x.image?`<img class="lib-cover" src="${esc(x.image)}" alt="Capa de ${esc(x.title)}">`:''}<div class="row"><h3>${esc(x.title)}</h3><span class="pill">${esc(x.category)}</span></div><p class="muted">${esc(x.description||'')}</p>${(x.links||[]).map(l=>`<p><a target="_blank" rel="noopener" href="${esc(l)}">${esc(l)}</a></p>`).join('')}<div class="actions" style="margin-top:12px"><button class="btn small" onclick="libraryForm(${db.library.indexOf(x)})">Editar</button><button class="btn small" onclick="if(confirm('Excluir item da biblioteca?')){db.library.splice(${db.library.indexOf(x)},1);save();render()}">Excluir</button></div></div>`).join('')||'<div class="empty">Nenhum material cadastrado.</div>'}
function imageToCover(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(new Error('Arquivo não é imagem'));const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const canvas=document.createElement('canvas'),size=600;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d'),scale=Math.max(size/im.width,size/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(size-w)/2,(size-h)/2,w,h);resolve(canvas.toDataURL('image/jpeg',0.82))};im.src=reader.result};reader.readAsDataURL(file)})}
function filterLibrary(){const q=($('#libSearch')?.value||'').toLowerCase(),cat=$('#libCat')?.value||'';$('#libgrid').innerHTML=libraryCards(db.library.filter(x=>((x.title||'')+' '+(x.description||'')+' '+(x.category||'')).toLowerCase().includes(q)&&(!cat||x.category===cat)))}

/* ---------- planejamento ---------- */
const COLS=['A tirar','Em processo/arranjo','Pronta pra tocar'];
function planning(){return `${header('Planejamento','Obras, pessoas e compromissos em preparação.','<button class="btn primary" onclick="commitmentForm()">＋ Novo compromisso</button>')}<div class="grid three" style="margin-bottom:6px"><div class="field"><label>Pessoa/intérprete</label><select id="personFilter" onchange="filterBoard()"><option value="">Todas as pessoas</option>${[...new Set(db.commitments.map(c=>c.person).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Evento</label><select id="eventFilter" onchange="filterBoard()"><option value="">Todos os eventos</option>${[...new Set(db.commitments.map(c=>c.event).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Prazo</label><select id="dueFilter" onchange="filterBoard()"><option value="">Todos os prazos</option><option value="upcoming">Próximos 30 dias</option><option value="overdue">Atrasados</option></select></div></div><div class="kanban" id="board">${boardColumns()}</div>`}
function boardColumns(){return COLS.map(col=>`<div class="kan-col" data-col="${col}"><h3>${col}</h3>${db.commitments.filter(c=>(c.stage||COLS[0])===col&&matchesFilter(c)).map(c=>`<article class="kan-card" draggable="true" tabindex="0" onclick="commitmentDetails(${db.commitments.indexOf(c)})" onkeydown="if(event.key==='Enter')commitmentDetails(${db.commitments.indexOf(c)})" ondragstart="event.dataTransfer.setData('text/plain','${db.commitments.indexOf(c)}')"><b>${esc(c.title)}</b><p>${esc(c.person||'Pessoa não definida')} · ${esc(c.event||'Evento não definido')}</p>${c.description?`<p>${esc(c.description)}</p>`:''}<div class="due">${fmtDate(c.due)}</div></article>`).join('')||'<div class="empty tiny">Arrasta uma obra para cá ou adiciona um compromisso.</div>'}</div>`).join('')}
function matchesFilter(c){const p=$('#personFilter')?.value||'',e=$('#eventFilter')?.value||'',d=$('#dueFilter')?.value||'';if(p&&c.person!==p||e&&c.event!==e)return false;if(d==='overdue'&&(!c.due||c.due>=today()||c.stage==='Pronta pra tocar'))return false;if(d==='upcoming'&&(!c.due||c.due<today()||c.due>new Date(Date.now()+30*86400000).toISOString().slice(0,10)))return false;return true}
function filterBoard(){$('#board').innerHTML=boardColumns();bindDrops()}
function bindDrops(){$$('.kan-col').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.style.outline='2px dashed var(--amber)'};el.ondragleave=()=>el.style.outline='';el.ondrop=e=>{e.preventDefault();el.style.outline='';const i=+e.dataTransfer.getData('text/plain');if(db.commitments[i]){db.commitments[i].stage=el.dataset.col;save();filterBoard()}}})}
function commitmentForm(idx=null,workIndex=null){const c=idx===null?{}:db.commitments[idx];modal(`<h2>${idx===null?'Novo compromisso':'Editar compromisso'}</h2><form id="commitForm"><div class="field"><label>Obra</label><select name="workIndex"><option value="">Cadastrar título manualmente</option>${db.works.map((w,i)=>`<option value="${i}" ${(workIndex===i||c.workIndex===i)?'selected':''}>${esc(w.title)} · ${esc(w.composer||'')}</option>`).join('')}</select></div><div class="field"><label>Nome da música</label><input name="title" value="${esc(c.title||(workIndex!==null?db.works[workIndex]?.title:'')||'')}" placeholder="Título da obra" required></div><div class="grid two"><div class="field"><label>Pessoa/intérprete</label><input name="person" value="${esc(c.person||'')}"></div><div class="field"><label>Evento</label><input name="event" value="${esc(c.event||'')}"></div></div><div class="grid two"><div class="field"><label>Prazo</label><input type="date" name="due" value="${c.due||''}"></div><div class="field"><label>Etapa</label><select name="stage">${COLS.map(x=>`<option ${(c.stage||'A tirar')===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Descrição musical</label><textarea name="description" placeholder="Ex.: Tom: Em · Violão solo; preparar introdução...">${esc(c.description||'')}</textarea></div><div class="actions"><button class="btn primary">Salvar compromisso</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`);
 $('#commitForm').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.workIndex=o.workIndex===''?null:+o.workIndex;if(o.workIndex!==null&&db.works[o.workIndex])o.title=db.works[o.workIndex].title;if(idx===null)db.commitments.push(o);else db.commitments[idx]=o;save();closeModal();render()}}
function commitmentDetails(i){const c=db.commitments[i];modal(`<h2>${esc(c.title)}</h2><p class="muted">${esc(c.person||'')} · ${esc(c.event||'')}</p><p>${esc(c.description||'Sem descrição musical.')}</p><p><span class="pill">${esc(c.stage||'A tirar')}</span> Prazo: ${fmtDate(c.due)}</p><div class="actions"><button class="btn primary" onclick="commitmentForm(${i})">Editar</button><button class="btn" onclick="if(confirm('Excluir compromisso?')){db.commitments.splice(${i},1);save();closeModal();render()}">Excluir</button></div>`)}

/* ---------- metrônomo ---------- */
const tempos=[[40,'Largo'],[60,'Larghetto'],[66,'Adagio'],[76,'Andante'],[108,'Moderato'],[120,'Allegro'],[168,'Presto'],[200,'Prestissimo']];
const SUBS={'Semínimas':1,'Colcheias':2,'Tercinas':3,'Semicolcheias':4};
function tempoName(b){let n='Prestissimo';for(const [v,s] of tempos)if(b<v){n=s;break}return n}
function beatsPerBar(){return +metro.meter.split('/')[0]||4}
function metronome(){return `${header('Metrônomo','Um pulso claro para estudar com intenção.')}<div class="mdev panel screws"><div class="mtop"><span class="kicker">Andamento</span><span class="led-sm" id="tempoName">${tempoName(metro.bpm)}</span></div>
<div class="lcd mlcd"><div class="bpm" id="bpm">${metro.bpm}</div><small>BPM</small></div>
<div class="arm-box" aria-hidden="true"><i class="arm ${metro.running?'run':''}" id="arm" style="--d:${60/metro.bpm}s"></i></div>
<div class="pulse" id="pulse" aria-hidden="true">${Array.from({length:beatsPerBar()},()=>'<i></i>').join('')}</div>
<div class="keys"><button class="btn" onclick="setBpm(metro.bpm-5)">−5</button><button class="btn" onclick="setBpm(metro.bpm-1)">−1</button><button class="btn" onclick="setBpm(metro.bpm+1)">+1</button><button class="btn" onclick="setBpm(metro.bpm+5)">+5</button></div>
<div style="max-width:420px;margin:14px auto"><input id="bpmRange" type="range" min="30" max="240" value="${metro.bpm}" oninput="setBpm(+this.value)" aria-label="Ajustar BPM"><div class="field" style="margin-top:10px"><label>Andamento exato</label><input id="bpmNum" type="number" min="30" max="240" value="${metro.bpm}" onchange="setBpm(+this.value)"></div></div>
<div class="transport"><button class="go ${metro.running?'on':''}" onclick="toggleMetro()" id="metroToggle" aria-pressed="${metro.running}">${metro.running?'PARAR':'▶ INICIAR'}</button><button class="btn" onclick="tapTempo()">Tap tempo</button></div>
<div class="grid two" style="text-align:left"><div class="field"><label>Compasso</label><select id="meter" onchange="metro.meter=this.value;render()">${['4/4','3/4','2/4','6/8','5/4','7/8'].map(m=>`<option ${metro.meter===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Subdivisão</label><select id="subdivision" onchange="metro.subdiv=this.value">${Object.keys(SUBS).map(s=>`<option ${metro.subdiv===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<div class="field" style="text-align:left"><label>Volume do clique</label><input id="volume" type="range" min="0" max="100" value="${metro.vol}" oninput="metro.vol=+this.value"></div><p class="tiny muted">O metrônomo usa o relógio de áudio do navegador para manter o tempo estável.</p></div>`}
let audioCtx=null,tapTimes=[];
function updateMetroUI(){$('#bpm').textContent=metro.bpm;$('#tempoName').textContent=tempoName(metro.bpm);$('#bpmRange').value=metro.bpm;$('#bpmNum').value=metro.bpm;$('#arm').style.setProperty('--d',60/metro.bpm+'s')}
function setBpm(v){metro.bpm=Math.max(30,Math.min(240,Math.round(v||80)));if(page==='metronomo')updateMetroUI()}
function schedule(){const sd=SUBS[metro.subdiv]||1,n=beatsPerBar();
 while(metro.next<audioCtx.currentTime+.12){const dt=60/metro.bpm/sd,main=metro.tick%sd===0,beat=Math.floor(metro.tick/sd)%n,t=metro.next;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),v=Math.max(.0002,metro.vol/100*.18*(main?1:.45));
  o.frequency.value=main?(beat===0?1100:750):500;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.05);
  if(main)setTimeout(()=>{if(metro.running)$$('#pulse i').forEach((x,i)=>x.classList.toggle('on',i===beat))},Math.max(0,(t-audioCtx.currentTime)*1000));
  metro.next+=dt;metro.tick++}}
function startMetro(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();metro.running=true;metro.tick=0;metro.next=audioCtx.currentTime+.08;schedule();metro.timer=setInterval(schedule,25)}
function stopMetro(){clearInterval(metro.timer);metro.running=false}
function toggleMetro(){if(metro.running)stopMetro();else startMetro();render()}
function tapTempo(){const n=Date.now();tapTimes.push(n);tapTimes=tapTimes.filter(t=>n-t<5000).slice(-6);if(tapTimes.length>=2){const gaps=tapTimes.slice(1).map((t,i)=>t-tapTimes[i]);setBpm(60000/(gaps.reduce((a,b)=>a+b,0)/gaps.length))}}

/* ---------- configurações e backup ---------- */
function settings(){return `${header('Configurações','Personaliza o allegro e protege teus registros.')}<div class="settings-panel grid"><div class="card"><h2>Aparência</h2><div class="field"><label>Tema</label><select id="themeSelect"><option value="light" ${db.settings.theme==='light'?'selected':''}>Claro (estúdio de dia)</option><option value="dark" ${db.settings.theme==='dark'?'selected':''}>Escuro (estúdio à noite)</option><option value="auto" ${db.settings.theme==='auto'?'selected':''}>Automático (sistema)</option></select></div><p class="tiny muted">As cores ficam em variáveis CSS no topo do arquivo (:root).</p></div><div class="card"><h2>Backup e restauração</h2><p class="muted">Exporta teus registros para um arquivo JSON. Guarda-o num local seguro; os dados ficam neste navegador.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">↓ Exportar backup</button><button class="btn" onclick="$('#importFile').click()">↑ Restaurar backup</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" onchange="importBackup(this.files[0])"></div></div><div class="card"><h2>Armazenamento</h2><p class="muted">Os registros são salvos automaticamente neste navegador. Limpar os dados do navegador pode apagá-los. O GitHub Pages hospeda a interface, não sincroniza os dados entre dispositivos.</p><span class="pill">Salvamento local ativo</span></div></div>`}
function exportBackup(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'allegro'},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='allegro-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;const n=blank();['sessions','exercises','works','library','commitments'].forEach(k=>n[k]=Array.isArray(x[k])?x[k]:[]);n.settings={...n.settings,...x.settings};db=n;save();render();toast('Backup restaurado')}catch{toast('Arquivo de backup inválido')}};r.readAsText(file)}

/* ---------- modal e eventos globais ---------- */
function modal(content){$('#modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;$('#modalRoot').querySelector('input:not([type=file]),select,textarea,button')?.focus()}
function closeModal(){$('#modalRoot').innerHTML=''}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
$('#settingsShortcut').onclick=()=>go('config');
document.addEventListener('change',e=>{if(e.target.id==='themeSelect'){db.settings.theme=e.target.value;save();render()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeModal();
 const c=e.target.closest?.('.hk-cell');if(!c)return;
 const step={ArrowRight:7,ArrowLeft:-7,ArrowDown:1,ArrowUp:-1}[e.key];if(!step)return;
 e.preventDefault();const all=[...c.parentElement.children],n=all[all.indexOf(c)+step];if(n){selectDay(n.dataset.d);n.focus()}});
document.addEventListener('click',e=>{const c=e.target.closest('.hk-cell');if(c)selectDay(c.dataset.d)});
// reação ao cursor: cartões inclinam, o HabitKit gira levemente
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||reduceMotion.matches)return;const t=e.target.closest?.('.tilt,.hk-wrap');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 if(t.classList.contains('hk-wrap')){t.style.setProperty('--ty',(x*12).toFixed(1)+'deg');t.style.setProperty('--tx',(50-y*8).toFixed(1)+'deg')}else{t.style.setProperty('--ry',(x*9).toFixed(1)+'deg');t.style.setProperty('--rx',(-y*9).toFixed(1)+'deg')}});
document.addEventListener('pointerout',e=>{const t=e.target.closest?.('.tilt,.hk-wrap');if(t&&!t.contains(e.relatedTarget))['--rx','--ry','--tx','--ty'].forEach(p=>t.style.removeProperty(p))});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(db.settings.theme==='auto')render()});
render();
</script>
